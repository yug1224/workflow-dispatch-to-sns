name: Workflow Dispatch to SNS
on:
  workflow_dispatch:
    inputs:
      message:
        description: '投稿するメッセージ'
        required: true
jobs:
  workflow-dispatch-to-sns:
    runs-on: macos-latest
    # 5分以上かかったらタイムアウト
    timeout-minutes: 5
    steps:
      # リポジトリのチェックアウト
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Cacheの復元
      - name: Cache Deno Deps
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ hashFiles('deno.lock') }}
      # Denoのセットアップ
      - name: Setup Deno
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1.5.2
        with:
          deno-version: v2.x
      # Denoの実行
      - name: Deno Run
        run: deno run --allow-read --allow-write --allow-env --allow-net --allow-ffi main.ts
        env:
          BLUESKY_IDENTIFIER: ${{secrets.BLUESKY_IDENTIFIER}}
          BLUESKY_PASSWORD: ${{secrets.BLUESKY_PASSWORD}}
          WEBHOOK_URL: ${{secrets.WEBHOOK_URL}}
          MESSAGE: ${{github.event.inputs.message}}
